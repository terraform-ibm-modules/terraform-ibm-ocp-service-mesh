{{- if .Values.useGatewayApi }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: k8s-gateway
  namespace: alb-ingress
spec:
  gatewayClassName: istio
  addresses:
  - type: Hostname
    value: alb-ingress.alb-ingress.svc.cluster.local
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
{{- end }}
