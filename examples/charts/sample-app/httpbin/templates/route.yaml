{{- if .Values.useGatewayApi }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: k8s-gateway
    namespace: alb-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /get
    backendRefs:
    - name: httpbin
      port: 8000
{{- end }}
