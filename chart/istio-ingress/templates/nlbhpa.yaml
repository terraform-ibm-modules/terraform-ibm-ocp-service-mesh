{{- if ne ((.Values.ingress).autoscale).enabled false -}}
{{- if (eq .Values.ingress.lbtype "nlb") }}
{{- range $lb_subnet, $lb_subnet_zone := .Values.ingress.nlbzonessubnets }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    {{- if $.Values.ingress.istioselectors }}
    {{- toYaml $.Values.ingress.istioselectors | nindent 4 }}
    {{- end }}
    release: istio
  {{- if $.Values.ingress.nlbAppendZoneToResourceNames }}
  name: {{ printf "%s-%s" $.Values.ingress.autoscale.hpa_name $lb_subnet_zone }}
  {{- else }}
  name: {{ $.Values.ingress.autoscale.hpa_name }}
  {{- end }}
  namespace: {{ $.Values.ingress.namespace }}
spec:
  metrics:
  {{- if $.Values.ingress.autoscale.cpu }}
  {{- if $.Values.ingress.autoscale.cpu.targetavgutil }}
  - resource:
      name: cpu
      target:
        averageUtilization: {{ $.Values.ingress.autoscale.cpu.targetavgutil }}
        type: Utilization
    type: Resource
  {{- end }}
  {{- end }}
  {{- if $.Values.ingress.autoscale.memory }}
  {{- if $.Values.ingress.autoscale.memory.targetavgutil }}
  - resource:
      name: memory
      target:
        averageUtilization: {{ $.Values.ingress.autoscale.memory.targetavgutil }}
        type: Utilization
    type: Resource
  {{- end }}
  {{- end }}
  minReplicas: {{ $.Values.ingress.autoscale.autoscaleMin }}
  maxReplicas: {{ $.Values.ingress.autoscale.autoscaleMax }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    {{- if $.Values.ingress.nlbAppendZoneToResourceNames }}
    name: {{ printf "%s-%s" $.Values.ingress.deploymentName $lb_subnet_zone }}
    {{- else }}
    name: {{ $.Values.ingress.deploymentName }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
