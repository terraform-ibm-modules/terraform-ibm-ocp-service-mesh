{{- if ne (.Values.ingress).createDeployment false -}}
{{- if and (or (eq .Values.ingress.lbtype "alb") (eq .Values.ingress.lbtype "other")) (eq .Values.ingress.daemonsetMode true) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.ingress.deploymentName }}
  namespace: {{ .Values.ingress.namespace }}
  {{- if .Values.ingress.deploymentCustomLabels }}
  labels:
  {{- toYaml .Values.ingress.deploymentCustomLabels | nindent 4 }}
  {{- end }}
  annotations:
  {{- if .Values.ingress.deploymentCustomAnnotations }}
  {{- toYaml .Values.ingress.deploymentCustomAnnotations | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.checkov_skip_list }}
  {{- if .Values.ingress.checkov_skip_list.deployment }}
  {{- range $k, $v := .Values.ingress.checkov_skip_list.deployment }}
    {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.istioselectors }}
  selector:
    matchLabels:
      {{- if .Values.ingress.istioselectors }}
      {{- toYaml .Values.ingress.istioselectors | nindent 6 }}
      {{- end }}
      {{- if .Values.ingress.extendSelector }}
      deploymentName: {{ .Values.ingress.deploymentName }}
      {{- end }}
  {{- end }}
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
      labels:
        {{- if .Values.ingress.istioselectors }}
        {{- toYaml .Values.ingress.istioselectors | nindent 8 }}
        {{- end }}
        {{- if .Values.ingress.extendSelector }}
        deploymentName: {{ .Values.ingress.deploymentName }}
        {{- end }}
        {{- if eq .Values.ingress.istioMeshEnrollment "default" }}
        sidecar.istio.io/inject: "true"
        {{- else }}
        istio.io/rev: "{{ .Values.ingress.istioMeshEnrollment }}"
        {{- end }}
        istio.io/gateway: "{{ .Values.ingress.name }}.{{ .Values.ingress.namespace }}"
    spec:
      {{- if .Values.ingress.affinity }}
      affinity:
        {{- if .Values.ingress.affinity.podAffinity }}
        podAffinity:
          {{- toYaml .Values.ingress.affinity.podAffinity | nindent 10 }}
        {{- end }}
        {{- if .Values.ingress.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml .Values.ingress.affinity.nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if .Values.ingress.affinity.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml .Values.ingress.affinity.podAntiAffinity | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if .Values.ingress.topologySpreadConstraints }}
      topologySpreadConstraints:
      {{- toYaml .Values.ingress.topologySpreadConstraints | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ .Values.ingress.serviceAccountName }}
      {{- if .Values.ingress.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.ingress.terminationGracePeriodSeconds }}
      {{- end }}
      tolerations:
      {{- if .Values.ingress.tolerations }}
      {{- toYaml .Values.ingress.tolerations | nindent 6 }}
      {{- end }}
      containers:
      - name: istio-proxy
        image: auto
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
        {{- if .Values.ingress.resources }}
        {{- toYaml .Values.ingress.resources | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 15090
          protocol: TCP
          name: http-envoy-prom
        {{- if .Values.ingress.ports }}
        {{- range .Values.ingress.ports }}
        - containerPort: {{ .port }}
          protocol: {{ .protocol | toString }}
          name: {{ .name }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}

