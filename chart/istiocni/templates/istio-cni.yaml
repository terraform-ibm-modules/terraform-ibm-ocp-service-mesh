apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  finalizers:
  - sailoperator.io/sail-operator
  name: {{ .Values.istiocniconfiguration.name }}
spec:
  namespace: {{ .Values.istiocniconfiguration.namespace }}
  {{- if .Values.istiocniconfiguration.ambient }}
  profile: ambient
  values:
    cni:
      ambient:
        dnsCapture: true
  {{- end }}
