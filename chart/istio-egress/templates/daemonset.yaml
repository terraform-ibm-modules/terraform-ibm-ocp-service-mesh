{{- if and (ne (.Values.egress).createDeployment false) (eq .Values.egress.daemonsetMode true) -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.egress.deploymentName }}
  namespace: {{ .Values.egress.namespace }}
  {{- if .Values.egress.deploymentCustomLabels }}
  labels:
  {{- toYaml .Values.egress.deploymentCustomLabels | nindent 4 }}
  {{- end }}
  annotations:
  {{- if .Values.egress.deploymentCustomAnnotations }}
  {{- toYaml .Values.egress.deploymentCustomAnnotations | nindent 4 }}
  {{- end }}
  {{- if .Values.egress.checkov_skip_list }}
  {{- if .Values.egress.checkov_skip_list.deployment }}
  {{- range $k, $v := .Values.egress.checkov_skip_list.deployment }}
    {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
spec:
  {{- if .Values.egress.istioselectors }}
  selector:
    matchLabels:
      {{- toYaml .Values.egress.istioselectors | nindent 6 }}
      {{- if .Values.egress.extendSelector }}
      deploymentName: {{ .Values.egress.deploymentName }}
      {{- end }}
  {{- end }}
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
      labels:
        {{- if .Values.egress.istioselectors }}
        {{- toYaml .Values.egress.istioselectors | nindent 8 }}
        {{- end }}
        {{- if .Values.egress.extendSelector }}
        deploymentName: {{ .Values.egress.deploymentName }}
        {{- end }}
        {{- if eq .Values.egress.istioMeshEnrollment "default" }}
        sidecar.istio.io/inject: "true"
        {{- else }}
        istio.io/rev: "{{ .Values.egress.istioMeshEnrollment }}"
        {{- end }}
        istio.io/gateway: "{{ .Values.egress.name }}.{{ .Values.egress.namespace }}"
    spec:
      {{- if .Values.egress.affinity }}
      affinity:
        {{- if .Values.egress.affinity.podAffinity }}
        podAffinity:
          {{- toYaml .Values.egress.affinity.podAffinity | nindent 10 }}
        {{- end }}
        {{- if .Values.egress.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml .Values.egress.affinity.nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if .Values.egress.affinity.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml .Values.egress.affinity.podAntiAffinity | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if .Values.egress.topologySpreadConstraints }}
      topologySpreadConstraints:
      {{- toYaml .Values.egress.topologySpreadConstraints | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ .Values.egress.serviceAccountName }}
      {{- if .Values.egress.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.egress.terminationGracePeriodSeconds }}
      {{- end }}
      tolerations:
      {{- if .Values.egress.tolerations }}
      {{- toYaml .Values.egress.tolerations | nindent 6 }}
      {{- end }}
      containers:
      - name: istio-proxy
        image: auto
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
        {{- if .Values.egress.resources }}
        {{- toYaml .Values.egress.resources | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 15090
          protocol: TCP
          name: http-envoy-prom
        {{- if .Values.egress.ports }}
        {{- range .Values.egress.ports }}
        - containerPort: {{ .port }}
          protocol: {{ .protocol | toString }}
          name: {{ .name }}
        {{- end }}
        {{- end }}
{{- end }}

