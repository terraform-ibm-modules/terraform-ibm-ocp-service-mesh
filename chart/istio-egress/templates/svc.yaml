{{- if ne (.Values.egress).createService false -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ default .Values.egress.name .Values.egress.serviceName }}
  namespace: {{ .Values.egress.namespace }}
  annotations:
spec:
  type: {{ .Values.egress.svctype }}
  internalTrafficPolicy: {{ .Values.egress.internalTrafficPolicy }}
  selector:
  {{- if .Values.egress.istioselectors }}
  {{- toYaml .Values.egress.istioselectors | nindent 4 }}
  {{- end }}
    deploymentName: {{ default .Values.egress.name .Values.egress.deploymentName }}
  ports:
  {{- if .Values.egress.ports }}
  {{- range .Values.egress.ports }}
  - port: {{ .port }}
    protocol: {{ .protocol | toString }}
    name: {{ .name | toString }}
    targetPort: {{ .targetPort }}
  {{- end }}
  {{- end }}
{{- end }}
