egress:
  name: default
  extendSelector: false
  createDeployment: true
  deploymentName: null
  createService: true
  serviceName: null
  createServiceAccount: true
  serviceAccountName: null
  namespace: istio-system
  istioMeshEnrollment:
  istioNamespaceEnrollmentLabels: {}
  istioselectors: {}
  deploymentCustomLabels: {}
  deploymentCustomAnnotations: {}
  svctype: ClusterIP
  ports:
  - port: 80
    name: svc-http
    protocol: TCP # UDP
    targetPort: 8080
  internalTrafficPolicy: Cluster
  autoscale:
    enabled: false
    hpa_name: null
    # autoscaleMin: 1
    # autoscaleMax: 3
    # cpu:
    #   targetavgutil: 80
    # memory:
    #   targetavgutil: 80
  pdb:
    name: null
    # minAvailable: 1
    # maxUnavailable: 2
  replicacount: 1
  resources:
    # limits:
    #   cpu: 2000m
    #   memory: 1024Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # nodeselector: { "ibm-cloud.kubernetes.io/worker-pool-name": "default" }
  terminationGracePeriodSeconds: 30
  topologySpreadConstraints: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: ibm-cloud.kubernetes.io/worker-pool-name
            operator: In
            values:
            - edge
  tolerations:
  checkov_skip_list:
    deployment:
    - checkov.io/skip1: CKV_K8S_31
    - checkov.io/skip2: CKV_K8S_8
    - checkov.io/skip2: CKV_K8S_12
