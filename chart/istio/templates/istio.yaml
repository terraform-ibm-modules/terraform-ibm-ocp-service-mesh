# https://github.com/istio-ecosystem/sail-operator/blob/main/docs/api-reference/sailoperator.io.md
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: {{ .Values.istioconfiguration.name }}
spec:
  namespace: {{ .Values.istioconfiguration.namespace }}
  updateStrategy:
    inactiveRevisionDeletionGracePeriodSeconds: 30
    type: InPlace
  global:
    defaultPodDisruptionBudget:
      enabled: {{ .Values.istioconfiguration.defaultpdb }}
  values:
    outboundTrafficPolicy: {{ .Values.istioconfiguration.outboundTrafficPolicy }}
    pilot:
      enabled: {{ .Values.istioconfiguration.pilot.enabled }}
      autoscaleEnabled: {{ .Values.istioconfiguration.pilot.autoscale.enabled }}
      replicaCount: {{ .Values.istioconfiguration.pilot.replicacount }}
      autoscaleMin: {{ .Values.istioconfiguration.pilot.autoscale.min }}
      autoscaleMax: {{ .Values.istioconfiguration.pilot.autoscale.max }}
      nodeSelector: {{- toYaml .Values.istioconfiguration.pilot.nodeselector | nindent 6 }} # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
      cpu:
        targetAverageUtilization: {{ .Values.istioconfiguration.pilot.autoscale.cpu.targetavgutil }}
      memory:
        targetAverageUtilization: {{ .Values.istioconfiguration.pilot.autoscale.memory.targetavgutil }}
      {{- if .Values.istioconfiguration.pilot.resources }} # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#resourcerequirements-v1-core
      resources: {{- toYaml .Values.istioconfiguration.pilot.resources | nindent 6 }} # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#affinity-v1-core
      {{- end }}
      {{- if .Values.istioconfiguration.pilot.affinity }}
      affinity:  {{- toYaml .Values.istioconfiguration.pilot.affinity | nindent 6 }} # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#affinity-v1-core
      {{- end }}
      {{- if .Values.istioconfiguration.pilot.tolerations }}
      tolerations: {{- toYaml .Values.istioconfiguration.pilot.tolerations | nindent 6 }} # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#toleration-v1-core
      {{- end }}
      {{- if .Values.istioconfiguration.taint }}
      taint: # https://github.com/istio-ecosystem/sail-operator/blob/main/docs/api-reference/sailoperator.io.md#pilottaintcontrollerconfig
        enabled: {{ .Values.istioconfiguration.pilot.taint.enabled }}
        namespace: {{ .Values.istioconfiguration.pilot.taint.namespace }}
      {{- end }}
    {{- if .Values.istioconfiguration.meshConfig }}
    meshConfig: # https://github.com/istio-ecosystem/sail-operator/blob/main/docs/api-reference/sailoperator.io.md#meshconfig
      {{- if .Values.istioconfiguration.meshConfig.connectTimeout }}
      connectTimeout: {{ .Values.istioconfiguration.meshConfig.connectTimeout }}
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.tcpKeepalive }}
      tcpKeepalive: {{- toYaml .Values.istioconfiguration.meshConfig.tcpKeepalive | nindent 6 }} # https://github.com/istio-ecosystem/sail-operator/blob/main/docs/api-reference/sailoperator.io.md#connectionpoolsettingstcpsettingstcpkeepalive
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.ingressControllerMode }}
      ingressControllerMode: {{ .Values.istioconfiguration.meshConfig.ingressControllerMode }} # https://github.com/istio-ecosystem/sail-operator/blob/main/docs/api-reference/sailoperator.io.md#meshconfigingresscontrollermode
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.ingressService }}
      ingressService: {{ .Values.istioconfiguration.meshConfig.ingressService }}
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.ingressSelector }}
      ingressSelector: {{ .Values.istioconfiguration.meshConfig.ingressSelector }}
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.enableTracing }}
      enableTracing: {{ .Values.istioconfiguration.meshConfig.enableTracing }}
      {{- end }}
      # accessLogFile: /dev/stdout
      # accessLogFormat:
      # accessLogEncoding: JSON
      {{- if .Values.istioconfiguration.meshConfig.outboundTrafficPolicy }}
      outboundTrafficPolicy:
        mode: {{ .Values.istioconfiguration.meshConfig.outboundTrafficPolicy }}
      {{- end }}
      {{- if .Values.istioconfiguration.meshConfig.discoverySelectors }}
      discoverySelectors:
        {{- toYaml .Values.istioconfiguration.meshConfig.discoverySelectors | nindent 8 }}
      {{- end }}
    {{- end }}
