apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  labels:
    operators.coreos.com/servicemeshoperator3.openshift-operators: ""
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.operator.namespace }}
spec:
  channel: stable
  installPlanApproval: {{ .Values.operator.installplanapproval }}
  name: {{ .Values.operator.name }}
  source: {{ .Values.operator.source }}
  sourceNamespace: {{ .Values.operator.sourcenamespace }}
  {{- if .Values.operator.version }}
  startingCSV: {{ .Values.operator.version }}
  {{- end }}
  {{- if .Values.operator.resources }}
  config:
    resources:
      {{- if .Values.operator.resources.requests }}
      requests:
        {{- if .Values.operator.resources.requests.cpu }}
        cpu: {{ .Values.operator.resources.requests.cpu }}
        {{- end }}
        {{- if .Values.operator.resources.requests.memory }}
        memory: {{ .Values.operator.resources.requests.memory }}
        {{- end }}
      {{- end }}
      {{- if .Values.operator.resources.limits }}
      limits:
        {{- if .Values.operator.resources.limits.cpu }}
        cpu: {{ .Values.operator.resources.limits.cpu }}
        {{- end }}
        {{- if .Values.operator.resources.limits.memory }}
        memory: {{ .Values.operator.resources.limits.memory }}
        {{- end }}
      {{- end }}
  {{- end }}
